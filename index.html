<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>untuk bopen 💗</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 20% 20%, #4b164d 0%, transparent 35%),
    radial-gradient(circle at 80% 80%, #25103d 0%, transparent 35%),
    #09050f;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* bintang */
.stars{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    radial-gradient(#ffffff 1px, transparent 1px),
    radial-gradient(#ffffff 1px, transparent 1px);
  background-size:80px 80px, 130px 130px;
  background-position:0 0, 40px 60px;
  opacity:.25;
}

/* nav */
nav{
  position:fixed;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:850px;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(18px);
  border-radius:25px;
  z-index:100;
}

nav button{
  border:none;
  color:white;
  background:transparent;
  padding:10px 15px;
  border-radius:18px;
  cursor:pointer;
  transition:.3s;
}

nav button:hover{
  background:rgba(255,100,190,.2);
  transform:translateY(-2px);
}

/* sections */
section{
  min-height:100vh;
  padding:110px 20px 70px;
  position:relative;
  z-index:2;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

/* home */
.hero{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-content{
  max-width:700px;
}

.badge{
  display:inline-block;
  padding:8px 16px;
  border-radius:30px;
  background:rgba(255,105,180,.12);
  border:1px solid rgba(255,105,180,.3);
  margin-bottom:20px;
  color:#ffb4df;
}

.hero h1{
  font-size:clamp(48px,10vw,90px);
  margin-bottom:15px;
  background:linear-gradient(90deg,#fff,#ff9ed8,#fff);
  background-size:200%;
  -webkit-background-clip:text;
  color:transparent;
  animation:shine 4s linear infinite;
}

@keyframes shine{
  to{background-position:200%}
}

.hero p{
  color:#d8c8d8;
  line-height:1.8;
  font-size:18px;
}

.main-heart{
  font-size:70px;
  margin:25px;
  animation:beat 1.3s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.2)}
}

.scroll{
  margin-top:40px;
  color:#aaa;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  50%{transform:translateY(8px)}
}
